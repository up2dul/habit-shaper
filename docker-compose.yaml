services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-habit_shaper}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-habit_shaper}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
      MYSQL_USER: ${MYSQL_USER:-habit_shaper}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/db/migrate.js"]
    environment:
      DATABASE_NAME: ${MYSQL_DATABASE:-habit_shaper}
      DATABASE_HOST: mysql
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-habit_shaper}
      DATABASE_PORT: 3306
      DATABASE_USER: ${MYSQL_USER:-habit_shaper}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_NAME: ${MYSQL_DATABASE:-habit_shaper}
      DATABASE_HOST: mysql
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-habit_shaper}
      DATABASE_PORT: 3306
      DATABASE_USER: ${MYSQL_USER:-habit_shaper}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "${API_PORT:-3000}:3000"
    restart: unless-stopped

  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/db/seed.js"]
    environment:
      NODE_ENV: development
      DATABASE_NAME: ${MYSQL_DATABASE:-habit_shaper}
      DATABASE_HOST: mysql
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-habit_shaper}
      DATABASE_PORT: 3306
      DATABASE_USER: ${MYSQL_USER:-habit_shaper}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "${WEB_PORT:-5173}:5173"
    restart: unless-stopped

volumes:
  mysql-data:
